<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Clube do Vinil</title>
  <link rel="stylesheet" href="style.css">
  
</head>
<body>

<header class="header">
  <img src="imagens/logo.png" alt="Clube do Vinil" class="logo">
  <h1> Clube do Vinil </h1>
</header>


<div class="container">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h3>Filtrar</h3>

    <label>Gênero</label>
    <select id="genre">
      <option value="">Todos</option>
      <option value="Rock">Rock</option>
      <option value="Jazz">Jazz</option>
      <option value="Hip Hop">Hip Hop</option>
      <option value="MPB">MPB</option>
      <option value="Pop">Pop</option>
    </select>

    <label>Preço</label>
    <select id="priceRange">
      <option value="">Todos</option>
      <option value="0-100">R$ 0 a R$ 100</option>
      <option value="100-200">R$ 100 a R$ 200</option>
      <option value="200-300">R$ 200 a R$ 300</option>
      <option value="300-500">R$ 300 a R$ 500</option>
      <option value="500+">Acima de R$ 500</option>
    </select>


    <label>Ano</label>
    <select id="yearFilter">
      <option value="">Todos</option>
      <option value="1970">1970 - 1979</option>
      <option value="1980">1980 - 1989</option>
      <option value="1990">1990 - 1999</option>
      <option value="2000">2000 - 2009</option>
      <option value="2010">2010+</option>
    </select>

    <button onclick="render()">Aplicar</button>
    
  </aside>

  <!-- PRODUTOS -->
  <main>
    <section class="categories">
      <h3>Explore por categoria</h3>
  
      <div class="category-grid">
  
        <div class="category-card" onclick="filtrarCategoria('')">
          <img src="imagens/caixa.avif">
          <span>Todos</span>
        </div>
  
        <div class="category-card" onclick="filtrarCategoria('Discos')">
          <img src="imagens/disco.png">
          <span>Discos</span>
        </div>
  
        <div class="category-card" onclick="filtrarCategoria('Vitrolas')">
          <img src="imagens/vitrola.webp">
          <span>Vitrolas</span>
        </div>
  
        <div class="category-card" onclick="filtrarCategoria('Acessorios')">
          <img src="imagens/acessorios.png">
          <span>Acessórios</span>
        </div>
           
      </div>

      <div class="top-bar">
          <span>Ordenar por:</span>
  
          <select id="sort">
            <option value="priceAsc">Menor preço</option>
            <option value="priceDesc">Maior preço</option>
          </select>
        </div>
</section>
    
    <div id="products" class="grid"></div>
    <div id="products" class="grid"></div>
    <div id="pagination" class="pagination"></div>

    
  </main>

</div>

<script src="script.js"></script>
</body>
</html>
